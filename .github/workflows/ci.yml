name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Validate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: therisingstars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/therisingstars_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres123@localhost:5432/therisingstars_test?sslmode=disable
      JWT_SECRET: ci_test_jwt_secret_32_chars_minimum_required
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma Generate
        working-directory: backend
        run: npx prisma generate

      - name: Prisma DB Push (Test Database)
        working-directory: backend
        run: npx prisma db push --force-reset --accept-data-loss

      - name: Run Tests
        working-directory: backend
        run: npm test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma Generate
        working-directory: backend
        run: npx prisma generate

      - name: Verify Startup (dry run)
        working-directory: backend
        run: node -e "import('./src/app.js').then(() => { console.log('App module loaded OK'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); })"
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci_build_check_jwt_secret_32_chars_minimum

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            npx @railway/cli@latest up --service backend
          else
            echo "RAILWAY_TOKEN not set — skipping deployment."
          fi
